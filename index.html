<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>一块游戏 · 外网 ACG</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="js/supabase.min.js"></script>
    <!-- 新增 qrcode 库，用于夸克网盘二维码生成 -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        secondary: '#8b5cf6',
                        accent: '#ec4899',
                        dark: '#0f172a',
                        'dark-light': '#1e293b',
                        'dark-lighter': '#334155',
                        'neon-blue': '#00f3ff',
                        'neon-purple': '#bf00ff'
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-dark text-white font-sans antialiased">
    <div class="bg-animation"><div class="gradient"></div><div class="dots"></div></div>
    <nav class="bg-dark-light bg-opacity-80 sticky top-0 z-50 border-b border-dark-lighter backdrop-blur-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa fa-gamepad text-primary text-3xl"></i>
                <h1 class="text-2xl font-bold bg-gradient-to-r from-primary to-accent bg-clip-text text-transparent">一块ACG</h1>
            </div>
            <div id="auth-section">
                <button id="login-btn" class="bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-medium py-2 px-6 rounded-full transition-all flex items-center btn-shine">
                    <i class="fa fa-user-circle mr-2"></i> 登录
                </button>
            </div>
        </div>
    </nav>
    <main class="container mx-auto px-4 py-8">
        <!-- 标签筛选 -->
        <div class="flex flex-wrap gap-2.5 mb-3 justify-center" id="tag-filters">
            <button class="tag-pill active px-4 py-2 rounded-full bg-primary text-white text-sm" data-tag="all">全部游戏</button>
            <button class="tag-pill px-4 py-2 rounded-full bg-dark-lighter text-white hover:bg-primary transition-colors text-sm" data-tag="搜集">搜集</button>
            <button class="tag-pill px-4 py-2 rounded-full bg-dark-lighter text-white hover:bg-primary transition-colors text-sm" data-tag="视觉小说">视觉小说</button>
            <button class="tag-pill px-4 py-2 rounded-full bg-dark-lighter text-white hover:bg-primary transition-colors text-sm" data-tag="生存">生存</button>
            <button class="tag-pill px-4 py-2 rounded-full bg-dark-lighter text-white hover:bg-primary transition-colors text-sm" data-tag="Unity">Unity</button>
            <button class="tag-pill px-4 py-2 rounded-full bg-dark-lighter text-white hover:bg-primary transition-colors text-sm" data-tag="RPG">RPG</button>
            <button class="tag-pill px-4 py-2 rounded-full bg-dark-lighter text-white hover:bg-primary transition-colors text-sm" data-tag="其它">其它</button>
        </div>
        <!-- 好评度筛选（支持与上方类型组合筛选） -->
        <div class="flex flex-wrap items-center gap-2 mb-6 justify-center" id="rating-filters">
            <span class="text-xs text-gray-400 mr-1"><i class="fa fa-thumbs-up text-accent mr-1"></i>好评度：</span>
            <button class="rating-pill tag-pill active px-3.5 py-1.5 rounded-full bg-accent text-white text-xs font-medium" data-rating="all">全部</button>
            <button class="rating-pill tag-pill px-3.5 py-1.5 rounded-full bg-dark-lighter text-gray-200 hover:bg-accent hover:text-white transition-colors text-xs" data-rating="压倒性好评">🔥 压倒性好评</button>
            <button class="rating-pill tag-pill px-3.5 py-1.5 rounded-full bg-dark-lighter text-gray-200 hover:bg-accent hover:text-white transition-colors text-xs" data-rating="极度好评">⭐ 极度好评</button>
            <button class="rating-pill tag-pill px-3.5 py-1.5 rounded-full bg-dark-lighter text-gray-200 hover:bg-accent hover:text-white transition-colors text-xs" data-rating="特别好评">特别好评</button>
            <button class="rating-pill tag-pill px-3.5 py-1.5 rounded-full bg-dark-lighter text-gray-200 hover:bg-accent hover:text-white transition-colors text-xs" data-rating="多半好评">多半好评</button>
            <button class="rating-pill tag-pill px-3.5 py-1.5 rounded-full bg-dark-lighter text-gray-200 hover:bg-accent hover:text-white transition-colors text-xs" data-rating="好评">好评</button>
            <button class="rating-pill tag-pill px-3.5 py-1.5 rounded-full bg-dark-lighter text-gray-200 hover:bg-accent hover:text-white transition-colors text-xs" data-rating="褒贬不一">褒贬不一</button>
        </div>
        <!-- 新增搜索框区域 -->
        <div class="max-w-2xl mx-auto mb-8">
            <div class="relative flex items-center gap-2">
                <div class="relative flex-1">
                    <i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="search-input" placeholder="搜索游戏名称..." 
                           class="w-full pl-10 pr-10 py-3 rounded-xl bg-dark-light/80 border border-gray-700 focus:border-neon-blue focus:outline-none transition-all">
                    <button id="search-clear" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white hidden">
                        <i class="fa fa-times-circle"></i>
                    </button>
                </div>
                <button id="search-btn" class="px-6 py-3 rounded-xl bg-gradient-to-r from-primary to-secondary hover:opacity-90 transition font-medium">
                    <i class="fa fa-search mr-1"></i> 搜索
                </button>
            </div>
            <div id="search-result-info" class="text-sm text-gray-400 mt-2 text-center hidden">
                <span id="search-result-count"></span> 个结果
            </div>
        </div>
        <!-- 游戏网格容器 -->
        <div id="gamesGrid"></div>
        <div class="flex justify-center mt-12">
            <button id="loadMoreBtn" class="px-8 py-3 rounded-full bg-gradient-to-r from-primary to-secondary hover:from-secondary hover:to-accent transition-all duration-300 flex items-center space-x-2 transform hover:scale-105 shadow-lg">
                <i class="fa fa-refresh"></i><span>加载更多游戏</span>
            </button>
        </div>
    </main>
    <!-- 游戏详情模态框 -->
    <div id="gameModal" class="fixed inset-0 z-50 hidden">
        <div class="modal-backdrop absolute inset-0 bg-black bg-opacity-80 backdrop-blur-sm flex items-center justify-center p-4">
            <div class="bg-dark-light rounded-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto transform transition-all duration-300 scale-95 opacity-0" id="modalContent">
                <div class="relative">
                    <button id="closeModal" class="absolute top-4 right-4 z-10 w-10 h-10 rounded-full bg-dark-lighter hover:bg-primary transition-colors"><i class="fa fa-times"></i></button>
                    <h2 id="modalTitle" class="text-2xl font-bold p-6 border-b border-dark-lighter text-center bg-gradient-to-r from-primary to-accent bg-clip-text text-transparent"></h2>
                    <div class="relative p-6">
                        <button id="prevImage" class="absolute left-2 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-dark-lighter hover:bg-primary"><i class="fa fa-chevron-left"></i></button>
                        <div id="previewImageContainer" class="w-full max-h-96 flex justify-center"><img id="previewImage" class="max-w-full max-h-96 object-contain rounded-lg"></div>
                        <button id="nextImage" class="absolute right-2 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-dark-lighter hover:bg-primary"><i class="fa fa-chevron-right"></i></button>
                        <div id="imageCounter" class="text-center mt-2 text-gray-400">1/1</div>
                        <div id="previewThumbnails" class="flex gap-2 overflow-x-auto justify-center mt-3 pb-1"></div>
                    </div>
                    <div class="p-6 border-t border-dark-lighter flex flex-wrap justify-center gap-4">
                        <a id="quark-link" href="#" target="_blank" class="px-6 py-3 rounded-full bg-gradient-to-r from-blue-500 to-blue-700 hover:from-blue-600 transition flex items-center space-x-2 cursor-pointer"><i class="fa fa-cloud-download"></i><span>夸克网盘</span></a>
                        <a id="thunder-link" href="#" target="_blank" class="px-6 py-3 rounded-full bg-gradient-to-r from-green-500 to-green-700 hover:from-green-600 transition flex items-center space-x-2"><i class="fa fa-bolt"></i><span>迅雷网盘</span></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- 夸克二维码弹窗DOM -->
    <div id="quark-qrcode-modal" class="fixed inset-0 z-[9999] hidden">
        <div id="quark-modal-overlay" class="absolute inset-0 bg-black/75 flex items-center justify-center p-4">
            <div id="quark-modal-box" class="bg-[#2c2c40] p-8 rounded-2xl w-[90%] max-w-[440px] border border-[#444] text-center text-white">
                <h3 class="text-[22px] mt-0 mb-2 font-semibold">手机扫码保存资源</h3>
                <p class="text-[12px] opacity-75 m-0 mb-6 whitespace-nowrap overflow-hidden text-ellipsis">建议先在夸克网盘 App 内保存资源，再在电脑端下载。</p>
                <div class="flex justify-center mb-6">
                    <canvas id="quark-qrcode-canvas"></canvas>
                </div>
                <button id="quark-modal-close-btn" class="w-full py-[11px] bg-[#6c5ce7] hover:bg-[#5b4cdb] text-white border-none rounded-lg cursor-pointer text-base transition-colors">关闭</button>
            </div>
        </div>
    </div>
    <!-- Toast 通知容器 -->
    <div id="toast-container" class="fixed top-20 right-4 z-[9999] flex flex-col gap-2"></div>
    <!-- 认证模态框 -->
    <div id="auth-modal" class="fixed inset-0 z-[60] hidden">
        <div id="auth-backdrop" class="absolute inset-0 bg-black/80 backdrop-blur-sm transition-opacity opacity-0"></div>
        <div class="absolute inset-0 flex items-center justify-center p-4 pointer-events-none">
            <div id="auth-modal-content" class="glass-effect rounded-2xl w-full max-w-md transform scale-95 opacity-0 transition-all duration-300 pointer-events-auto overflow-hidden">
                <div class="p-6">
                    <div class="flex gap-4 mb-6 border-b border-gray-700">
                        <button id="tab-login" class="pb-2 font-semibold tab-active">登录</button>
                        <button id="tab-register" class="pb-2 text-gray-400 font-semibold">注册</button>
                    </div>
                    <div id="login-form">
                        <form id="login-form-element" class="space-y-4">
                            <input type="email" id="login-email" name="email" autocomplete="username" placeholder="电子邮箱" class="w-full px-4 py-3 rounded-xl bg-dark/50 border border-gray-700 text-white focus:border-primary outline-none">
                            <input type="password" id="login-password" name="password" autocomplete="current-password" placeholder="密码" class="w-full px-4 py-3 rounded-xl bg-dark/50 border border-gray-700 text-white focus:border-primary outline-none">
                            <div class="text-right text-sm"><a href="#" id="forgot-password-link" class="text-neon-blue hover:underline">忘记密码？</a></div>
                            <button type="submit" id="login-submit" class="w-full py-3 rounded-xl bg-primary hover:bg-secondary transition font-bold"><span>登录</span></button>
                            <div id="login-loading" class="hidden text-center text-sm text-gray-400">处理中...</div>
                        </form>
                    </div>
                    <div id="register-form" class="hidden">
                        <form id="register-form-element" class="space-y-4">
                            <input type="email" id="register-email" name="email" autocomplete="email" placeholder="电子邮箱" class="w-full px-4 py-3 rounded-xl bg-dark/50 border border-gray-700 text-white focus:border-primary outline-none">
                            <input type="password" id="register-password" name="new-password" autocomplete="new-password" placeholder="密码（至少6位）" class="w-full px-4 py-3 rounded-xl bg-dark/50 border border-gray-700 text-white focus:border-primary outline-none">
                            <input type="password" id="register-confirm-password" name="confirm-password" autocomplete="new-password" placeholder="确认密码" class="w-full px-4 py-3 rounded-xl bg-dark/50 border border-gray-700 text-white focus:border-primary outline-none">
                            <button type="submit" id="register-submit" class="w-full py-3 rounded-xl bg-gradient-to-r from-purple-600 to-pink-600 hover:opacity-90 transition font-bold"><span>立即注册</span></button>
                            <div id="register-loading" class="hidden text-center text-sm text-gray-400">处理中...</div>
                        </form>
                    </div>
                    <div id="form-toggle-text" class="text-center text-gray-400 text-sm mt-6"></div>
                </div>
                <button id="close-auth-modal" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i class="fa fa-times"></i></button>
            </div>
        </div>
    </div>
    <!-- 返回顶部按钮 -->
    <button id="back-to-top-btn" class="hidden fixed bottom-6 right-5 z-40 w-11 h-11 rounded-full bg-gradient-to-r from-primary to-secondary text-white shadow-lg hover:scale-110 transition-transform items-center justify-center" title="返回顶部">
        <i class="fa fa-arrow-up"></i>
    </button>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script src="js/site-switcher.js" data-current-site="myacg"></script>
</body>
</html>
